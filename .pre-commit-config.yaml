default_language_version:
  ruby: 3.2.3

repos:
  - repo: local
    hooks:
      - id: aspect_rules_lint_fmt
        name: Format
        language: system
        entry: bazel run //:format
        files: .*
  - repo: local
    hooks:
      - id: aspect_rules_lint_lint
        name: Lint
        language: system
        entry: ./lint.sh
        files: .*
